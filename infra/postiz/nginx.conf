# sosyal.veriteknik.com -> Postiz (127.0.0.1:4007). Certificate from setup_ssl (certbot).
server {
    server_name sosyal.veriteknik.com;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/sosyal.veriteknik.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sosyal.veriteknik.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 512m;
    location / {
        proxy_pass http://127.0.0.1:4007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
server {
    listen 80;
    server_name sosyal.veriteknik.com;
    location /.well-known/acme-challenge/ { root /var/www/sosyal.veriteknik.com; }
    location / { return 301 https://$host$request_uri; }
}
