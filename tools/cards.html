<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/500.css">
<style>
  :root{--bg:#07080d;--card:#0e1220;--line:#1d2336;--txt:#e7eaf3;--mut:#8a93ab;--acc:#7c5cff;--acc2:#e05cff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;font-family:Inter,'Noto Color Emoji',sans-serif;color:var(--txt)}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(140px);opacity:.28}
  .g1{background:#2b1a7a;left:-300px;top:900px}.g2{background:#5a1a6e;right:-350px;top:1300px}
  header{position:absolute;top:120px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center}
  header img{height:58px}
  .pill{border:1.5px solid #34307a;background:#12112b;border-radius:40px;padding:14px 26px;font-size:28px;font-weight:600;font-family:'JetBrains Mono',monospace}
  .hero{position:absolute;top:250px;left:64px;right:64px}
  .hero .v{font-size:120px;font-weight:700;letter-spacing:-.02em;background:linear-gradient(90deg,#7fb2ff,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent;line-height:1.05}
  .hero .s{font-size:40px;color:var(--mut);font-weight:600;margin-top:6px}
  .list{position:absolute;top:520px;left:48px;right:48px;display:flex;flex-direction:column;gap:22px}
  .card{display:flex;gap:26px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:26px 30px;min-height:160px}
  .card.on{border-color:#4a3fb0;box-shadow:0 0 0 2px #2c2670 inset}
  .ic{font-size:64px;width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:#151a2e;border-radius:20px;flex:none;font-family:'Noto Color Emoji'}
  .t{font-size:40px;font-weight:700;line-height:1.15}
  .u{font-size:28px;color:var(--mut);margin-top:6px;line-height:1.3}
  .cta{position:absolute;top:250px;left:48px;right:48px;height:1210px;border-radius:28px;background:radial-gradient(circle at 50% 30%,#1d1650,#0b0d19 70%);border:1.5px solid #2c2a66;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center;padding:60px}
  .cta img{height:84px}
  .cta h2{font-size:62px;line-height:1.2;font-weight:700}
  .cta .grad{background:linear-gradient(90deg,#7fb2ff,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
  .cta .link{font-family:'JetBrains Mono';font-size:40px;border:1.5px solid #34307a;border-radius:18px;padding:26px 40px;background:#0f1124}
  .cap{position:absolute;left:60px;right:60px;top:1540px;text-align:center;font-size:42px;font-weight:700;line-height:1.3;text-shadow:0 2px 12px #000}
  .cap span{background:rgba(7,8,13,.75);padding:6px 14px;border-radius:12px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .foot{position:absolute;left:64px;right:64px;bottom:120px;font-size:26px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<header><img src="logo-text.png" alt=""><div class="pill" id="pill"></div></header>
<div class="hero" id="hero"><div class="v" id="ver"></div><div class="s">Bu sürümde neler var?</div></div>
<div class="list" id="list"></div>
<div class="cta" id="cta"><img src="logo-text.png" alt=""><h2>Tüm yenilikler<br><span class="grad">panelinizde</span></h2><div class="link">veriteknik.com</div></div>
<div class="cap" id="cap"></div>
<div class="foot">VeriTeknik sürüm notları</div>
<script>
const D = window.DATA;
const $ = id => document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const ease=x=>1-Math.pow(1-clamp(x,0,1),3);
$('pill').textContent = 'v' + D.version;
$('ver').textContent = 'v' + D.version;
const list = $('list');
const cards = D.cards.map(c => { const el = document.createElement('div'); el.className='card';
  el.innerHTML = `<div class="ic">${c.icon}</div><div><div class="t"></div><div class="u"></div></div>`;
  el.querySelector('.t').textContent=c.title; el.querySelector('.u').textContent=c.sub; list.appendChild(el); return el; });
const cues = D.cues; // [[start,end,caption]] for sentences: 0 intro, 1..n cards, n+1 outro
window.render = function(t){
  cards.forEach((el,i)=>{ const t0 = cues[i+1][0]; const p = ease((t-t0)/.45);
    el.style.opacity = t<t0?0:p; el.style.transform=`translateX(${(1-p)*60}px)`;
    const active = t>=cues[i+1][0] && t<cues[i+1][1]+.2; el.classList.toggle('on', active); });
  const tc = cues[cues.length-1][0]; const cp = ease((t-tc)/.6);
  $('cta').style.opacity = t<tc?0:cp; list.style.opacity = 1-cp; $('hero').style.opacity = 1-cp;
  const cue = cues.find(q=>t>=q[0]&&t<q[1]); $('cap').innerHTML = cue?`<span>${cue[2].replace(/</g,'&lt;')}</span>`:'';
};
render(0);
</script>
</body>
</html>
